version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kuwait-platform-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: kuwait_platform
    volumes:
      - mongodb_data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - kuwait-platform-network

  redis:
    image: redis:7.2-alpine
    container_name: kuwait-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kuwait-platform-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kuwait-platform-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/kuwait_platform?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - kuwait-platform-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kuwait-platform-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kuwait-platform-network

volumes:
  mongodb_data:
  redis_data:

networks:
  kuwait-platform-network:
    driver: bridge